<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Profile | EcoFinance SL</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/dashboard.css">

    </head>

        <body>

            <div class="wrapper">

                <!-- Sidebar -->
                <aside class="sidebar">

                    <div class="logo">
                        <i class="fa-solid fa-leaf"></i><span>EcoFinance SL</span>
                    </div>

                    <ul>

                        <li>
                            <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
                        </li>

                        <li>
                            <a href="company.html"><i class="fa-solid fa-building"></i><span>Company</span></a>
                        </li>

                        <li>
                            <a href="input.html"><i class="fa-solid fa-calculator"></i><span>Carbon Input</span></a>
                        </li>

                        <li>
                            <a href="esg-input.html"><i class="fa-solid fa-calculator"></i><span>ESG Input</span></a>
                        </li>

                        <li>
                            <a href="esg-dashboard.html"><i class="fa-solid fa-chart-line"></i><span>ESG Dashboard</span></a>
                        </li>

                        <li>
                            <a href="reports.html"><i class="fa-solid fa-file-lines"></i><span>Reports</span></a>
                        </li>

                        <li class="active">
                            <a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
                        </li>

                        <li class="mt-5">
                            <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
                        </li>

                    </ul>

                </aside>

                <!-- Main -->
                <main class="main">

                    <nav class="navbar-custom">

                        <h3>My Profile</h3>

                        <div class="d-flex align-items-center">

                            <img src="Images/user.png" alt="User" class="rounded-circle" width="42">
                            <span class="ms-2" id="username">User</span>

                        </div>

                    </nav>

                    <div class="container mt-4">

                        <div class="card-box p-4">

                            <h4 class="mb-4">
                                <i class="fa-solid fa-user-gear me-2"></i>Account Information
                            </h4>

                            <div id="message"></div>

                            <div class="mb-3">
                                <label>Full Name</label>
                                <input type="text" id="full_name" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" id="email" class="form-control" readonly>
                            </div>

                            <div class="mb-3">
                                <label>New Password</label>
                                <input type="password" id="password" class="form-control">
                            </div>

                            <button class="btn btn-success" onclick="updateProfile()">
                                <i class="fa-solid fa-floppy-disk"></i>Update Profile
                            </button>

                        </div>

                    </div>

                </main>

            </div>

            <script src="js/auth.js"></script>
            <script src="js/profile.js"></script>

        </body>

</html>
