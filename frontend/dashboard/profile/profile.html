<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>My Profile | EcoFinance SL</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body class="bg-slate-100">
    <div class="flex h-screen">
      <div id="sidebar"></div>

      <div class="flex-1 flex flex-col overflow-hidden">
        <div id="header"></div>

        <main class="overflow-auto p-8 space-y-8">
          <!-- Profile -->

          <div class="bg-white rounded-xl shadow p-6">
            <div class="flex items-center gap-6 mb-8">
              <div
                id="avatar"
                class="w-24 h-24 rounded-full bg-emerald-600 text-white flex items-center justify-center text-4xl font-bold"
              >
                U
              </div>

              <div>
                <h2 id="profileName" class="text-3xl font-bold">User Name</h2>

                <p id="profileRole" class="text-gray-500">
                  Company Administrator
                </p>
              </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
              <div>
                <label class="font-medium"> Full Name </label>

                <input
                  id="fullName"
                  class="w-full border rounded-lg p-3 mt-2"
                />
              </div>

              <div>
                <label> Username </label>

                <input
                  id="username"
                  disabled
                  class="w-full border rounded-lg p-3 mt-2 bg-gray-100"
                />
              </div>

              <div>
                <label> Email </label>

                <input id="email" class="w-full border rounded-lg p-3 mt-2" />
              </div>

              <div>
                <label> Role </label>

                <input
                  id="role"
                  disabled
                  class="w-full border rounded-lg p-3 mt-2 bg-gray-100"
                />
              </div>
            </div>

            <div class="mt-8 text-right">
              <button
                id="updateProfileBtn"
                class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-lg"
              >
                <i class="fa-solid fa-user-pen mr-2"></i>

                Update Profile
              </button>
            </div>
          </div>

          <!-- Change Password -->

          <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-2xl font-semibold mb-6">Change Password</h2>

            <div class="grid md:grid-cols-3 gap-6">
              <div>
                <label> Current Password </label>

                <input
                  id="currentPassword"
                  type="password"
                  class="w-full border rounded-lg p-3 mt-2"
                />
              </div>

              <div>
                <label> New Password </label>

                <input
                  id="newPassword"
                  type="password"
                  class="w-full border rounded-lg p-3 mt-2"
                />
              </div>

              <div>
                <label> Confirm Password </label>

                <input
                  id="confirmPassword"
                  type="password"
                  class="w-full border rounded-lg p-3 mt-2"
                />
              </div>
            </div>

            <div class="mt-8 text-right">
              <button
                id="changePasswordBtn"
                class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg"
              >
                <i class="fa-solid fa-key mr-2"></i>

                Change Password
              </button>
            </div>
          </div>

          <!-- Preferences -->

          <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-2xl font-semibold mb-6">Preferences</h2>

            <div class="grid md:grid-cols-2 gap-6">
              <div>
                <label> Language </label>

                <select id="language" class="w-full border rounded-lg p-3 mt-2">
                  <option value="en">English</option>
                  <option value="si">Sinhala</option>
                  <option value="ta">Tamil</option>
                </select>
              </div>

              <div>
                <label> Theme </label>

                <select id="theme" class="w-full border rounded-lg p-3 mt-2">
                  <option value="light">Light</option>
                  <option value="dark">Dark</option>
                </select>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/layout.js"></script>

    <script>
      loadLayout("profile", "My Profile", "..");
    </script>

    <script src="profile.js"></script>
  </body>
</html>
