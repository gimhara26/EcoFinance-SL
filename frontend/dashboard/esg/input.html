<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>ESG Input</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body class="bg-slate-100">
    <div class="flex h-screen">
      <div id="sidebar"></div>

      <div class="flex-1 flex flex-col overflow-hidden">
        <div id="header"></div>

        <main class="overflow-auto p-8 space-y-8">
          <!-- Environmental -->

          <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-semibold text-green-700 mb-6">
              <i class="fa-solid fa-leaf mr-2"></i>

              Environmental
            </h2>

            <div class="grid md:grid-cols-2 gap-6">
              <div>
                <label>Renewable Energy (%)</label>

                <input
                  id="renewableEnergy"
                  type="number"
                  class="w-full border rounded-lg p-3 mt-2"
                />
              </div>

              <div>
                <label>Water Consumption (m³)</label>

                <input
                  id="waterConsumption"
                  type="number"
                  class="w-full border rounded-lg p-3 mt-2"
                />
              </div>

              <div>
                <label>Waste Recycling (%)</label>

                <input
                  id="wasteRecycling"
                  type="number"
                  class="w-full border rounded-lg p-3 mt-2"
                />
              </div>
            </div>
          </div>

          <!-- Social -->

          <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-semibold text-blue-700 mb-6">
              <i class="fa-solid fa-users mr-2"></i>

              Social
            </h2>

            <div class="grid md:grid-cols-2 gap-6">
              <input
                id="employees"
                placeholder="Employee Count"
                class="border rounded-lg p-3"
              />

              <input
                id="femaleEmployees"
                placeholder="Female Employees"
                class="border rounded-lg p-3"
              />

              <input
                id="trainingHours"
                placeholder="Training Hours"
                class="border rounded-lg p-3"
              />

              <input
                id="communityInvestment"
                placeholder="Community Investment"
                class="border rounded-lg p-3"
              />
            </div>
          </div>

          <!-- Governance -->

          <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-semibold text-purple-700 mb-6">
              <i class="fa-solid fa-scale-balanced mr-2"></i>

              Governance
            </h2>

            <div class="grid md:grid-cols-2 gap-6">
              <input
                id="boardMembers"
                placeholder="Board Members"
                class="border rounded-lg p-3"
              />

              <input
                id="independentDirectors"
                placeholder="Independent Directors"
                class="border rounded-lg p-3"
              />

              <select id="ethicsPolicy" class="border rounded-lg p-3">
                <option value="true">Ethics Policy - Yes</option>
                <option value="false">Ethics Policy - No</option>
              </select>

              <select id="antiCorruption" class="border rounded-lg p-3">
                <option value="true">Anti-Corruption Policy - Yes</option>
                <option value="false">Anti-Corruption Policy - No</option>
              </select>
            </div>
          </div>

          <div class="flex justify-end gap-4">
            <button
              id="calculateBtn"
              class="bg-blue-600 text-white px-6 py-3 rounded-lg"
            >
              Calculate ESG Score
            </button>

            <button
              id="saveBtn"
              class="bg-emerald-600 text-white px-6 py-3 rounded-lg"
            >
              Save ESG Data
            </button>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/layout.js"></script>

    <script>
      loadLayout("esg", "ESG Input", "..");
    </script>

    <script src="esg.js"></script>
  </body>
</html>
