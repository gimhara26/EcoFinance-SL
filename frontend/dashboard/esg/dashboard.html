<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>ESG Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body class="bg-slate-100">
    <div class="flex h-screen">
      <div id="sidebar"></div>

      <div class="flex-1 flex flex-col">
        <div id="header"></div>

        <main class="p-8 overflow-auto">
          <div class="grid lg:grid-cols-4 gap-6">
            <div class="bg-white rounded-xl shadow p-6 text-center">
              <p>Overall ESG</p>

              <h1
                id="overallScore"
                class="text-5xl font-bold text-emerald-600 mt-4"
              >
                0
              </h1>
            </div>

            <div class="bg-white rounded-xl shadow p-6">
              Environmental

              <h2 id="environmentScore" class="text-3xl mt-4 font-bold">0</h2>
            </div>

            <div class="bg-white rounded-xl shadow p-6">
              Social

              <h2 id="socialScore" class="text-3xl mt-4 font-bold">0</h2>
            </div>

            <div class="bg-white rounded-xl shadow p-6">
              Governance

              <h2 id="governanceScore" class="text-3xl mt-4 font-bold">0</h2>
            </div>
          </div>

          <div class="grid lg:grid-cols-2 gap-6 mt-8">
            <div class="bg-white rounded-xl shadow p-6">
              <canvas id="radarChart"></canvas>
            </div>

            <div class="bg-white rounded-xl shadow p-6">
              <canvas id="trendChart"></canvas>
            </div>
          </div>

          <div class="bg-white rounded-xl shadow p-6 mt-8">
            <h2 class="text-xl font-semibold mb-4">Recommendations</h2>

            <ul id="recommendations" class="list-disc pl-6 space-y-2"></ul>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/layout.js"></script>

    <script>
      loadLayout("esg", "ESG Dashboard", "..");
    </script>

    <script src="esg.js"></script>
  </body>
</html>
