<!doctype html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Company Profile | EcoFinance SL</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>

<link rel="stylesheet" href="company.css">


</head>

<body class="bg-slate-100">


<div class="flex h-screen">

    <div id="sidebar"></div>

    <div class="flex-1 flex flex-col overflow-hidden">

        <div id="header"></div>

        <main class="flex-1 overflow-auto p-8 space-y-8">

            <div class="bg-white rounded-xl shadow p-6">

                <h2 class="text-2xl font-semibold mb-6">
                    Basic Information
                </h2>

                <div class="grid md:grid-cols-2 gap-6">

                    <div>

                        <label
                            for="company_name"
                            class="block font-medium mb-2"
                        >
                            Company Name
                        </label>

                        <input
                            id="company_name"
                            type="text"
                            class="w-full border rounded-lg p-3"
                            placeholder="Enter company name"
                        >

                    </div>

                    <div>

                        <label
                            for="registration_no"
                            class="block font-medium mb-2"
                        >
                            Registration Number
                        </label>

                        <input
                            id="registration_no"
                            type="text"
                            class="w-full border rounded-lg p-3"
                            placeholder="Enter registration number"
                        >

                    </div>

                    <div>

                        <label
                            for="business_sector"
                            class="block font-medium mb-2"
                        >
                            Business Sector
                        </label>

                        <input
                            id="business_sector"
                            type="text"
                            class="w-full border rounded-lg p-3"
                            placeholder="Enter business sector"
                        >

                    </div>

                    <div>

                        <label
                            for="website"
                            class="block font-medium mb-2"
                        >
                            Website
                        </label>

                        <input
                            id="website"
                            type="url"
                            class="w-full border rounded-lg p-3"
                            placeholder="https://example.com"
                        >

                    </div>

                </div>

            </div>


            <div class="bg-white rounded-xl shadow p-6">

                <h2 class="text-2xl font-semibold mb-6">
                    Location
                </h2>

                <div class="space-y-6">

                    <div>

                        <label
                            for="address"
                            class="block font-medium mb-2"
                        >
                            Address
                        </label>

                        <textarea
                            id="address"
                            rows="4"
                            class="w-full border rounded-lg p-3"
                            placeholder="Enter company address"
                        ></textarea>

                    </div>


                    <div class="grid md:grid-cols-2 gap-6">

                        <div>

                            <label
                                for="province"
                                class="block font-medium mb-2"
                            >
                                Province
                            </label>

                            <select
                                id="province"
                                class="w-full border rounded-lg p-3"
                            >

                                <option value="">
                                    Select Province
                                </option>

                            </select>

                        </div>


                        <div>

                            <label
                                for="district"
                                class="block font-medium mb-2"
                            >
                                District
                            </label>

                            <select
                                id="district"
                                class="w-full border rounded-lg p-3"
                            >

                                <option value="">
                                    Select District
                                </option>

                            </select>

                        </div>

                    </div>

                </div>

            </div>


            <div class="bg-white rounded-xl shadow p-6">

                <h2 class="text-2xl font-semibold mb-6">
                    Contact
                </h2>

                <div class="grid md:grid-cols-2 gap-6">

                    <div>

                        <label
                            for="contact_no"
                            class="block font-medium mb-2"
                        >
                            Contact Number
                        </label>

                        <input
                            id="contact_no"
                            type="text"
                            class="w-full border rounded-lg p-3"
                            placeholder="Enter contact number"
                        >

                    </div>


                    <div>

                        <label
                            for="email"
                            class="block font-medium mb-2"
                        >
                            Email
                        </label>

                        <input
                            id="email"
                            type="email"
                            class="w-full border rounded-lg p-3 bg-gray-100"
                            readonly
                        >

                    </div>

                </div>

            </div>


            <div
                id="companyError"
                class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg p-4"
            ></div>


            <div class="flex justify-end gap-4">

                <button
                    id="cancelBtn"
                    type="button"
                    class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-3 rounded-lg"
                >
                    Cancel
                </button>


                <button
                    id="saveBtn"
                    type="button"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-lg"
                >

                    <i class="fa-solid fa-floppy-disk mr-2"></i>

                    Save Changes

                </button>

            </div>

        </main>

    </div>

</div>


<script src="/dashboard/components/js/layout.js"></script>

<script>
    loadLayout("company", "Company Profile");
</script>

<script src="company.js"></script>


</body>

</html>
