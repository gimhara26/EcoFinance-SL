<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Company Profile | EcoFinance SL</title>


  <!-- Tailwind CSS -->

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- Font Awesome -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />


  <!-- Company CSS -->

  <link rel="stylesheet" href="company.css" />

</head>


<body class="bg-slate-100">


  <!-- Main Layout -->

  <div class="flex h-screen">


    <!-- Dynamic Sidebar -->

    <div id="sidebar" class="h-full flex-shrink-0"></div>


    <!-- Right Side -->

    <div class="flex-1 flex flex-col overflow-hidden">


      <!-- Dynamic Header -->

      <div id="header"></div>


      <!-- Main Content -->

      <main class="flex-1 overflow-auto p-8">


        <!-- Basic Information -->

        <div class="card">

          <h2 class="card-title">
            Basic Information
          </h2>


          <div class="grid md:grid-cols-2 gap-6">


            <!-- Company Name -->

            <div>

              <label for="company_name" class="label">
                Company Name
              </label>

              <input id="company_name" class="input" type="text" />

            </div>


            <!-- Registration Number -->

            <div>

              <label for="registration_no" class="label">
                Registration Number
              </label>

              <input id="registration_no" class="input" type="text" />

            </div>


            <!-- Business Sector -->

            <div>

              <label for="business_sector" class="label">
                Business Sector
              </label>

              <input id="business_sector" class="input" type="text" />

            </div>


            <!-- Website -->

            <div>

              <label for="website" class="label">
                Website
              </label>

              <input id="website" class="input" type="url" />

            </div>

          </div>

        </div>


        <!-- Location -->

        <div class="card mt-8">

          <h2 class="card-title">
            Location
          </h2>


          <div class="space-y-6">


            <!-- Address -->

            <div>

              <label for="address" class="label">
                Address
              </label>

              <textarea id="address" rows="4" class="input"></textarea>

            </div>


            <!-- Province / District -->

            <div class="grid md:grid-cols-2 gap-6">


              <!-- Province -->

              <div>

                <label for="province" class="label">
                  Province
                </label>

                <select id="province" class="input">

                  <option value="">
                    Select Province
                  </option>

                </select>

              </div>


              <!-- District -->

              <div>

                <label for="district" class="label">
                  District
                </label>

                <select id="district" class="input">

                  <option value="">
                    Select District
                  </option>

                </select>

              </div>

            </div>

          </div>

        </div>


        <!-- Contact -->

        <div class="card mt-8">

          <h2 class="card-title">
            Contact
          </h2>


          <div class="grid md:grid-cols-2 gap-6">


            <!-- Contact Number -->

            <div>

              <label for="contact_no" class="label">
                Contact Number
              </label>

              <input id="contact_no" type="text" class="input" />

            </div>


            <!-- Email -->

            <div>

              <label for="email" class="label">
                Email
              </label>

              <input id="email" type="email" class="input" disabled />

            </div>

          </div>

        </div>


        <!-- Buttons -->

        <div class="mt-8 flex justify-end gap-4">


          <!-- Cancel -->

          <button id="cancelBtn" type="button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-3 rounded-lg">

            Cancel

          </button>


          <!-- Save -->

          <button id="saveBtn" type="button"
            class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-lg">

            <i class="fa-solid fa-floppy-disk mr-2"></i>

            Save Changes

          </button>

        </div>


      </main>

    </div>

  </div>


  <!-- Shared Layout -->

  <script src="/dashboard/components/js/layout.js"></script>


  <!-- Load Sidebar + Header -->

  <script>

    loadLayout(
      "company",
      "Company Profile"
    );

  </script>


  <!-- Company JavaScript -->

  <script src="company.js"></script>


</body>

</html>
