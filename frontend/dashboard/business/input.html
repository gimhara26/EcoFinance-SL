<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Business Input | EcoFinance SL</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="./business.css" />

</head>

<body class="bg-slate-100">

<div class="flex h-screen">

    <aside
        id="sidebar"
        class="w-64 bg-slate-900 text-white flex flex-col shadow-xl"
    >

        <div class="h-20 flex items-center justify-center border-b border-slate-700">

            <div class="text-center">

                <i class="fa-solid fa-leaf text-4xl text-emerald-400 mb-2"></i>

                <h1 class="font-bold text-xl">
                    EcoFinance SL
                </h1>

            </div>

        </div>


        <nav class="flex-1 px-4 py-6 space-y-2">

            <a
                href="/dashboard/dashboard.html"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg"
            >
                <i class="fa-solid fa-house w-5"></i>
                <span>Dashboard</span>
            </a>


            <a
                href="/dashboard/company/company.html"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg"
            >
                <i class="fa-solid fa-building w-5"></i>
                <span>Company</span>
            </a>


            <a
                href="/dashboard/business/input.html"
                class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg"
            >
                <i class="fa-solid fa-industry w-5"></i>
                <span>Business Input</span>
            </a>


            <a
                href="/dashboard/esg/input.html"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg"
            >
                <i class="fa-solid fa-seedling w-5"></i>
                <span>ESG Input</span>
            </a>


            <a
                href="/dashboard/esg/dashboard.html"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg"
            >
                <i class="fa-solid fa-chart-line w-5"></i>
                <span>ESG Dashboard</span>
            </a>


            <a
                href="/dashboard/reports/reports.html"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg"
            >
                <i class="fa-solid fa-file-lines w-5"></i>
                <span>Reports</span>
            </a>


            <a
                href="/dashboard/profile/profile.html"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg"
            >
                <i class="fa-solid fa-user w-5"></i>
                <span>Profile</span>
            </a>

        </nav>


        <div class="p-4 border-t border-slate-700">

            <button
                id="logoutBtn"
                type="button"
                class="w-full bg-red-500 hover:bg-red-600 py-3 rounded-lg transition"
            >

                <i class="fa-solid fa-right-from-bracket mr-2"></i>

                Logout

            </button>

        </div>

    </aside>


    <div class="flex-1 flex flex-col overflow-hidden">


        <header
            class="h-20 bg-white shadow flex items-center justify-between px-8"
        >

            <div>

                <h2 class="text-3xl font-bold text-slate-800">
                    Business Input
                </h2>

                <p class="text-gray-500">
                    Enter your business activity data
                </p>

            </div>


            <div class="flex items-center gap-4">

                <div class="text-right">

                    <h3
                        id="headerCompanyName"
                        class="font-semibold text-slate-800"
                    >
                        Loading...
                    </h3>

                    <p class="text-gray-500 text-sm">
                        Company Account
                    </p>

                </div>


                <div
                    id="userInitial"
                    class="w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center text-lg font-bold"
                >
                    U
                </div>

            </div>

        </header>


        <main class="flex-1 overflow-y-auto p-8">


            <div class="bg-white rounded-xl shadow p-6">

                <h2 class="text-xl font-semibold mb-6">
                    Reporting Period
                </h2>


                <div class="grid md:grid-cols-2 gap-6">


                    <div>

                        <label
                            for="reportingYear"
                            class="font-medium"
                        >
                            Reporting Year
                        </label>

                        <input
                            id="reportingYear"
                            type="number"
                            value="2026"
                            class="w-full mt-2 border rounded-lg p-3"
                        />

                    </div>


                    <div>

                        <label
                            for="reportingMonth"
                            class="font-medium"
                        >
                            Reporting Month
                        </label>

                        <select
                            id="reportingMonth"
                            class="w-full mt-2 border rounded-lg p-3"
                        >

                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>

                        </select>

                    </div>

                </div>

            </div>


            <div class="bg-white rounded-xl shadow p-6 mt-8">

                <h2 class="text-xl font-semibold mb-6">
                    Business Information
                </h2>


                <div class="grid md:grid-cols-2 gap-6">


                    <div>

                        <label for="electricity">
                            Electricity Consumption (kWh)
                        </label>

                        <input
                            id="electricity"
                            type="number"
                            min="0"
                            class="w-full mt-2 border rounded-lg p-3"
                        />

                    </div>


                    <div>

                        <label for="fuel">
                            Fuel Consumption (Liters)
                        </label>

                        <input
                            id="fuel"
                            type="number"
                            min="0"
                            class="w-full mt-2 border rounded-lg p-3"
                        />

                    </div>


                    <div>

                        <label for="transport">
                            Transport Distance (km)
                        </label>

                        <input
                            id="transport"
                            type="number"
                            min="0"
                            class="w-full mt-2 border rounded-lg p-3"
                        />

                    </div>


                    <div>

                        <label for="waste">
                            Waste Generated (kg)
                        </label>

                        <input
                            id="waste"
                            type="number"
                            min="0"
                            class="w-full mt-2 border rounded-lg p-3"
                        />

                    </div>

                </div>

            </div>


            <div class="flex justify-end gap-4 mt-8">

                <button
                    id="calculateBtn"
                    type="button"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg"
                >

                    <i class="fa-solid fa-calculator mr-2"></i>

                    Calculate Carbon

                </button>


                <button
                    id="saveBtn"
                    type="button"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg"
                >

                    <i class="fa-solid fa-floppy-disk mr-2"></i>

                    Save Data

                </button>

            </div>


            <div
                id="resultCard"
                class="bg-white rounded-xl shadow p-6 mt-8 hidden"
            >

                <h2 class="text-xl font-semibold">
                    Estimated Carbon Emission
                </h2>


                <h1
                    id="totalEmission"
                    class="text-5xl font-bold text-red-500 mt-5"
                >
                    0 kg CO₂
                </h1>

            </div>


            <div
                id="businessError"
                class="hidden mt-6 bg-red-50 border border-red-200 text-red-700 rounded-lg p-4"
            ></div>


        </main>

    </div>

</div>


<script src="./business.js"></script>


<script>

    const logoutBtn =
        document.getElementById("logoutBtn");

    logoutBtn.addEventListener("click", function () {

        localStorage.removeItem("token");

        localStorage.removeItem("user");

        window.location.href = "/login.html";

    });


    async function loadHeaderCompany() {

        const token =
            localStorage.getItem("token");

        if (!token) {
            return;
        }

        const API_BASE_URL =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"
                ? "http://127.0.0.1:5000/api"
                : "https://www.ecofinancesl.online/api";


        try {

            const response = await fetch(
                `${API_BASE_URL}/company/`,
                {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                }
            );


            if (!response.ok) {
                return;
            }


            const data =
                await response.json();


            const company =
                data.company || data;


            const companyName =
                company.company_name || "Company";


            document.getElementById(
                "headerCompanyName"
            ).textContent = companyName;


            document.getElementById(
                "userInitial"
            ).textContent =
                companyName.charAt(0).toUpperCase();

        } catch (error) {

            console.error(
                "Header company error:",
                error
            );

        }

    }


    loadHeaderCompany();

</script>

</body>

</html>
