<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Business Input | EcoFinance SL</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body class="bg-slate-100">
    <div class="flex h-screen">
      <div id="sidebar"></div>

      <div class="flex-1 flex flex-col overflow-hidden">
        <div id="header"></div>

        <main class="overflow-auto p-8">
          <!-- Reporting Period -->

          <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-semibold mb-6">Reporting Period</h2>

            <div class="grid md:grid-cols-2 gap-6">
              <div>
                <label class="font-medium"> Reporting Year </label>

                <input
                  id="reportingYear"
                  type="number"
                  value="2026"
                  class="w-full mt-2 border rounded-lg p-3"
                />
              </div>

              <div>
                <label class="font-medium"> Reporting Month </label>

                <select
                  id="reportingMonth"
                  class="w-full mt-2 border rounded-lg p-3"
                >
                  <option value="1">January</option>
                  <option value="2">February</option>
                  <option value="3">March</option>
                  <option value="4">April</option>
                  <option value="5">May</option>
                  <option value="6">June</option>
                  <option value="7">July</option>
                  <option value="8">August</option>
                  <option value="9">September</option>
                  <option value="10">October</option>
                  <option value="11">November</option>
                  <option value="12">December</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Business Data -->

          <div class="bg-white rounded-xl shadow p-6 mt-8">
            <h2 class="text-xl font-semibold mb-6">Business Information</h2>

            <div class="grid md:grid-cols-2 gap-6">
              <div>
                <label> Electricity Consumption (kWh) </label>

                <input
                  id="electricity"
                  type="number"
                  class="w-full mt-2 border rounded-lg p-3"
                />
              </div>

              <div>
                <label> Fuel Consumption (Liters) </label>

                <input
                  id="fuel"
                  type="number"
                  class="w-full mt-2 border rounded-lg p-3"
                />
              </div>

              <div>
                <label> Transport Distance (km) </label>

                <input
                  id="transport"
                  type="number"
                  class="w-full mt-2 border rounded-lg p-3"
                />
              </div>

              <div>
                <label> Waste Generated (kg) </label>

                <input
                  id="waste"
                  type="number"
                  class="w-full mt-2 border rounded-lg p-3"
                />
              </div>
            </div>
          </div>

          <!-- Buttons -->

          <div class="flex justify-end gap-4 mt-8">
            <button
              id="calculateBtn"
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg"
            >
              <i class="fa-solid fa-calculator mr-2"></i>

              Calculate Carbon
            </button>

            <button
              id="saveBtn"
              class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg"
            >
              <i class="fa-solid fa-floppy-disk mr-2"></i>

              Save Data
            </button>
          </div>

          <!-- Result -->

          <div
            id="resultCard"
            class="bg-white rounded-xl shadow p-6 mt-8 hidden"
          >
            <h2 class="text-xl font-semibold">Estimated Carbon Emission</h2>

            <h1 id="totalEmission" class="text-5xl font-bold text-red-500 mt-5">
              0 kg CO₂
            </h1>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/layout.js"></script>

    <script>
      loadLayout("business", "Business Input", "..");
    </script>

    <script src="business.js"></script>
  </body>
</html>
