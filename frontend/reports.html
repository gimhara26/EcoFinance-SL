<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Reports | EcoFinance SL</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/dashboard.css">

    </head>

    <body>

        <div class="wrapper">

            <!-- Sidebar -->
            <aside class="sidebar">

                <div class="logo">
                    <i class="fa-solid fa-leaf me-2"></i><span> EcoFinance SL</span>
                </div>

                <ul>

                    <li>
                        <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
                    </li>

                    <li>
                        <a href="company.html"><i class="fa-solid fa-building"></i><span>Company</span></a>
                    </li>

                    <li>
                        <a href="input.html"><i class="fa-solid fa-calculator"></i><span>Carbon Input</span></a>
                    </li>

                    <li>
                        <a href="esg-input.html"><i class="fa-solid fa-calculator"></i><span>ESG Input</span></a>
                    </li>

                    <li>
                        <a href="esg-dashboard.html"><i class="fa-solid fa-chart-line"></i><span>ESG Dashboard</span></a>
                    </li>

                    <li class="active">
                        <a href="reports.html"><i class="fa-solid fa-file-lines"></i><span>Reports</span></a>
                    </li>

                    <li>
                        <a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
                    </li>

                    <li class="mt-5">
                        <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
                    </li>

                </ul>

            </aside>

            <!-- Main -->
            <main class="main">

                <nav class="navbar-custom">

                    <h3>Reports</h3>

                    <div class="d-flex align-items-center">

                        <img src="Images/User.svg" alt="User" width="42" class="rounded-circle">
                        <span class="ms-2 fw-semibold" id="username">User</span>

                    </div>

                </nav>

                <div class="container mt-4">

                    <!-- Button -->
                    <div class="card-box p-4 mb-4">

                        <h4 class="mb-3">
                            <i class="fa-solid fa-file-export me-2"></i>Generate ESG Report
                        </h4>

                        <p class="text-muted">
                            Generate latest sustainability report based on Carbon + ESG data
                        </p>

                        <button class="btn btn-success" onclick="generateReport()">
                            <i class="fa-solid fa-bolt"></i>Generate Report
                        </button>

                        <div id="message" class="mt-3"></div>

                    </div>

                    <!-- Report Table -->
                    <div class="card-box p-4">

                        <div class = "d-flex justify-content-between align-items-center mb-3">

                            <h4><i class="fa-solid fa-file-lines me-2"></i>GeneratedReports</h4>
                            <span class ="badge bg-success"> ESG Report</span>

                        </div>

                        <div class="mb-3">

                            <input type="text" id="searchReport" class="form-control" placeholder="Search reports...">

                        </div>

                        <div class ="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead class="table-success">

                                    <tr>
                                        <th>Title</th>
                                        <th>Type</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th width="180">Action</th>
                                    </tr>

                                </thead>

                            <tbody id ="reportTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </main>

        </div>

        <!-- Report Viewer-->

        <div class ="modal fade" id="reportModal" tabindex="-1">

            <div class ="modal-dialog modal-xl">

                <div class ="modal-content">

                    <div class ="modal-header bg-success text-white">

                        <h5 class ="modal-title" id="reportTitle">Report</h5>
                        <button class ="btn-close btn-close-white" data-bs-dismiss="modal"></button>

                    </div>

                    <div class ="modal-body">

                        <pre id="reportContent" style = "white-space:pre-wrap; font-family:calibri; font-size: 15px;"></pre>

                    </div>

                </div>

            </div>
            
        </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/reports.js"></script>

    </body>

</html>
