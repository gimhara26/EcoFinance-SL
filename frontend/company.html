<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Company | EcoFinance SL</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="wrapper">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-solid fa-leaf me-2"></i><span> EcoFinance SL</span>
        </div>

        <ul>
          <li>
            <a href="dashboard.html"
              ><i class="fa-solid fa-house"></i><span>Dashboard</span></a
            >
          </li>

          <li class="active">
            <a href="company.html"
              ><i class="fa-solid fa-building"></i><span>Company</span></a
            >
          </li>

          <li>
            <a href="input.html"
              ><i class="fa-solid fa-calculator"></i
              ><span>Carbon Input</span></a
            >
          </li>

          <li>
            <a href="esg-input.html"
              ><i class="fa-solid fa-calculator"></i><span>ESG Input</span></a
            >
          </li>

          <li>
            <a href="esg-dashboard.html"
              ><i class="fa-solid fa-chart-line"></i
              ><span>ESG Dashboard</span></a
            >
          </li>

          <li>
            <a href="reports.html"
              ><i class="fa-solid fa-file-lines"></i><span>Reports</span></a
            >
          </li>

          <li>
            <a href="profile.html"
              ><i class="fa-solid fa-user"></i><span>Profile</span></a
            >
          </li>

          <li class="mt-5">
            <a href="#" onclick="logout()"
              ><i class="fa-solid fa-right-from-bracket"></i
              ><span>Logout</span></a
            >
          </li>
        </ul>
      </aside>

      <!-- Main -->
      <main class="main">
        <nav class="navbar-custom">
          <h3>Company Information</h3>

          <div class="d-flex align-items-center">
            <img
              src="Images/User.svg"
              alt="User"
              width="42"
              class="rounded-circle"
            />
            <span class="ms-2 fw-semibold" id="username">User</span>
          </div>
        </nav>

        <div class="container mt-4">
          <div class="card-box p-4">
            <h4 class="mb-4">
              <i class="fa-solid fa-building me-2"></i> Company Details
            </h4>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label>Company Name</label>
                <input id="company_name" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label>Business Sector</label>
                <input id="business_sector" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label>Registration No</label>
                <input id="registration_no" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label>Contact Number</label>
                <input id="contact_no" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label>District</label>
                <input id="district" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label>Province</label>
                <input id="province" class="form-control" />
              </div>

              <div class="col-md-12 mb-3">
                <label>Address</label>
                <textarea id="address" rows="3" class="form-control"></textarea>
              </div>

              <div class="col-md-12 mb-4">
                <label>Website</label>
                <input id="website" class="form-control" />
              </div>
            </div>

            <button
              id="saveBtn"
              class="btn btn-success"
              onclick="saveCompany()"
            >
              <i class="fa-solid fa-floppy-disk"></i> Save Company
            </button>

            <span class="ms-3" id="message"></span>
          </div>
        </div>
      </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/company.js"></script>
  </body>
</html>
