<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Login - EcoFinance SL</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Icons -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

        <style>
            body {
                background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Arial;
            }

            .login-card {
                width: 380px;
                background: rgba(255, 255, 255, 0.12);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                padding: 30px;
                color: white;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }

            .form-control {
                background: rgba(255, 255, 255, 0.15);
                border: none;
                color: white;
            }

            .form-control::placeholder {
                color: #ddd;
            }

            .input-group-text {
                background: rgba(255, 255, 255, 0.15);
                border: none;
                color: white;
            }

            .btn-login {
                background: #00c896;
                border: none;
            }

            .btn-login:hover {
                background: #00a87a;
            }

            .toggle-eye {
                cursor: pointer;
            }

            .msg {
                font-size: 14px;
                margin-top: 10px;
            }
        </style>
    </head>

        <body>

            <div class="login-card">

                <h3 class="text-center mb-4">
                    <i class="fa-solid fa-leaf"></i> EcoFinance SL
                </h3>

                <!-- Email -->
                <div class="mb-3">
                    <label>Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="Enter email">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label>Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Enter password">
                        <span class="input-group-text toggle-eye" onclick="togglePassword()">
                            <i id="eyeIcon" class="fa fa-eye"></i>
                        </span>
                    </div>
                </div>

                <!-- Button -->
                <button class="btn btn-login w-100" onclick="login()"> Login </button>

                <p id="msg" class="text-center msg"></p>

                <p class="text-center mt-3"> No account? <a href="register.html" style="color:#00ffcc;">Register</a></p>

            </div>

            <script>

            function togglePassword() {
                let pass = document.getElementById("password");
                let icon = document.getElementById("eyeIcon");

                if (pass.type === "password") {
                    pass.type = "text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");
                } else {
                    pass.type = "password";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");
                }
            }

            async function login() {

                let res = await fetch("http://127.0.0.1:5000/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value
                    })
                });

                let data = await res.json();

                let msg = document.getElementById("msg");
                msg.innerText = data.message;

                if (data.success) {
                    msg.style.color = "#00ffcc";

                    localStorage.setItem("token", data.token);
                    localStorage.setItem("user", JSON.stringify(data.user));

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 800);
                } else {
                    msg.style.color = "#ff6b6b";
                }
            }

            </script>
            <script src="js/auth.js"></script>
        </body>
</html>
