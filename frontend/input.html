<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Carbon Input | EcoFinance SL</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/dashboard.css">

    </head>

        <body>

            <div class="wrapper">

                <!-- Sidebar -->
                <aside class="sidebar">

                    <div class="logo">
                        <i class="fa-solid fa-leaf me-2"></i><span> EcoFinance SL</span>
                    </div>

                    <ul>

                        <li>
                            <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
                        </li>

                        <li>
                            <a href="company.html"><i class="fa-solid fa-building"></i><span>Company</span></a>
                        </li>

                        <li class="active">
                            <a href="input.html"><i class="fa-solid fa-calculator"></i><span>Carbon Input</span></a>
                        </li>

                        <li>
                            <a href="esg-input.html"><i class="fa-solid fa-calculator"></i><span>ESG Input</span></a>
                        </li>

                        <li>
                            <a href="esg-dashboard.html"><i class="fa-solid fa-chart-line"></i><span>ESG Dashboard</span></a>
                        </li>

                        <li>
                            <a href="reports.html"><i class="fa-solid fa-file-lines"></i><span>Reports</span></a>
                        </li>

                        <li>
                            <a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
                        </li>

                        <li class="mt-5">
                            <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
                        </li>

                    </ul>

                </aside>

                <!-- Main Content -->
                <main class="main">

                    <nav class="navbar-custom">

                        <h3>Carbon Emission Calculator</h3>

                        <div class="d-flex align-items-center">
                            <img src="Images/User.svg" alt="User" width="42" class="rounded-circle">
                            <span class="ms-2 fw-semibold" id="username">User</span>
                        </div>

                    </nav>

                    <div class="container mt-4">

                        <div class="card-box p-4">

                            <h4 class="mb-4">
                                <i class="fa-solid fa-earth-americas me-2 text-success"></i> Business Activity Input
                            </h4>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label"> Electricity (kWh)</label>
                                    <input type="number" id="electricity_kwh"  class="form-control" min="0" placeholder="Enter electricity usage">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fuel (Liters)</label>
                                    <input type="number" id="fuel_liters" class="form-control" min="0" placeholder="Enter fuel usage">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Transport Distance (km)</label>
                                    <input type="number" id="transport_distance" class="form-control" min="0" placeholder="Enter transport distance">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Waste (kg)</label>
                                    <input type="number" id="waste_kg" class="form-control" min="0" placeholder="Enter waste generated">
                                </div>

                            </div>

                            <div class="mt-4">
                                <button class="btn btn-success" onclick="saveCarbonData()">
                                    <i class="fa-solid fa-calculator"></i> Calculate Carbon Emission
                                </button>
                            </div>

                            <hr>

                            <div id="resultArea" style="display:none;">

                                <h4 class="text-success"> Carbon Calculation Result </h4>

                                <div class="alert alert-success mt-3">
                                    <h3 id="totalEmission"> 0 kg CO₂ </h3>
                                </div>

                            </div>

                            <div id="message" class="mt-3"> </div>

                        </div>

                    </div>

                </main>

            </div>

        <script src="js/auth.js"></script>
        <script src="js/carbon.js"></script>

        </body>

</html>
